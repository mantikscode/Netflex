<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>showFlix – Watch series and films</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=showflix-icon-20261102">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=christmas-home-20261123">
</head>
<body class="holiday-active">
<nav id="nav" aria-label="Main navigation">
  <button class="logo" id="logo" type="button" aria-label="Open showFlix welcome screen"><span class="logo-show">show</span><span class="logo-flix">Flix</span></button>
  <div class="nav-links">
    <button class="on" type="button" data-f="all" aria-current="page">Home</button><button type="button" data-f="Film">Movies</button><button type="button" data-f="Series">Series</button><button class="hm" type="button" data-f="list">My List</button>
  </div>
  <span class="sp"></span>

  <input class="search" id="q" placeholder="Search titles" aria-label="Search titles">
</nav>

<div class="holiday-effects" id="holidayEffects" aria-hidden="true"></div>
<div class="holiday-garland" aria-hidden="true">
  <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
</div>
<button class="holiday-toggle" id="holidayToggle" type="button" aria-label="Turn off Christmas effects" aria-pressed="true" title="Turn off Christmas effects">
  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2v20M4.6 6.3l14.8 11.4M19.4 6.3 4.6 17.7M8 4l4 2 4-2M8 20l4-2 4 2M3.5 10l3.8 2-3.8 2M20.5 10l-3.8 2 3.8 2"></path></svg>
</button>

<section class="landing" id="landing" aria-label="Welcome to showFlix" hidden>
  <div class="landing-mosaic" id="landingMosaic" aria-hidden="true"></div>
  <div class="landing-shade" aria-hidden="true"></div>
  <div class="landing-content">
    <h1 class="landing-title"><span class="landing-title-show">show</span><span class="landing-title-flix">Flix</span></h1>
    <form class="landing-search" id="landingSearchForm" role="search">
      <input id="landingSearch" type="search" placeholder="Search movies and shows..." aria-label="Search movies and shows">
      <button type="submit" aria-label="Search titles"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 4.5 4.5"></path></svg></button>
    </form>
    <div class="landing-actions" aria-label="Browse the catalog">
      <button class="landing-action primary" type="button" data-landing-filter="all">Explore now <span aria-hidden="true">▶</span></button>
      <button class="landing-action" type="button" data-landing-filter="Film">Movies</button>
      <button class="landing-action" type="button" data-landing-filter="Series">TV Shows</button>
    </div>
  </div>
</section>

<header class="hero" id="hero">
  <div class="hero-backdrops" aria-hidden="true">
    <div class="hero-backdrop" id="heroBackdropA"></div>
    <div class="hero-backdrop" id="heroBackdropB"></div>
  </div>
  <div class="info" id="hinfo">
    <div class="tag" id="htag"></div>
    <h1 id="ht"></h1>
    <p id="hd"></p>
    <div class="btns">
      <button class="btn p" id="hplay">▶ Play</button>
      <button class="btn s" id="hmore"><svg class="info-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M10 9v5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="10" cy="6" r="1" fill="currentColor"/></svg> More info</button>
    </div>
    <div class="hero-slider-controls" id="heroSliderControls" hidden>
      <button class="hero-slide-arrow" id="heroPrev" type="button" aria-label="Previous featured title"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m14 18-6-6 6-6"/></svg></button>
      <div class="hero-slide-dots" id="heroSlideDots" role="group" aria-label="Featured titles"></div>
      <button class="hero-slide-arrow" id="heroNext" type="button" aria-label="Next featured title"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m10 18 6-6-6-6"/></svg></button>
    </div>
  </div>
  <div class="player" id="player" hidden>
    <video id="vid" playsinline preload="metadata"></video>
    <div class="err" id="verr" hidden></div>
    <div class="ctrl">
      <button id="pp" aria-label="Play or pause">▶</button>
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek">
      <span id="tm">0:00</span>
      <button id="mu" aria-label="Mute">🔊</button>
      <button id="fs" aria-label="Full screen">⛶</button>
      <button id="cl" aria-label="Close player">✕</button>
    </div>
  </div>
</header>

<main class="rows" id="rows"></main>

<footer id="footer"><span>Questions? Visit the Help Centre</span><span>Terms of Use</span><span>Privacy</span><span>Devices</span><span>© 2026 Jeremy Kioko. All rights reserved.</span></footer>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
  <div class="sheet">
    <div class="mh" id="mh"><button class="x" id="x" aria-label="Close">✕</button><h3 id="mt"></h3></div>
    <div class="mb">
      <div class="detail-layout">
        <img class="detail-poster" id="detailPoster" alt="" hidden>
        <div class="detail-copy">
          <div class="btns"><button class="btn p" id="mplay">▶ Play</button><button class="btn s" id="add">+ My List</button></div>
          <div class="meta" id="mm"></div>
          <p id="md"></p>
        </div>
        <aside class="lead-cast" id="leadCast" aria-label="Main cast">
          <h4>Main cast</h4>
          <div class="cast-list" id="castList"><p class="cast-status">Loading cast…</p></div>
        </aside>
      </div>
      <div class="detail-player" id="detailPlayer" hidden>
        <div class="episode-controls" id="episodeControls" hidden>
          <label for="episodeSeason">Season
            <select id="episodeSeason"></select>
          </label>
          <label for="episodeNumber">Episode
            <select id="episodeNumber"></select>
          </label>
        </div>
        <div class="player-frame" id="playerFrame" hidden>
          <iframe id="detailStream" title="Movie or series player" frameborder="0" allowfullscreen allow="autoplay; encrypted-media" hidden></iframe>
          <video id="detailVideo" controls playsinline preload="metadata" hidden></video>
        </div>
        <a class="external-player-link" id="externalPlayerLink" target="_blank" rel="noopener noreferrer" hidden>Open player in a new tab</a>
        <p class="detail-player-message" id="detailPlayerMessage" hidden></p>
      </div>
    </div>
  </div>
</div>



<script src="script.js?v=christmas-home-20261123"></script>
</body>
</html>
