<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>showFlix – Watch series and films</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=showflix-icon-20261102">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=centered-navigation-20261102">
</head>
<body>
<nav id="nav">
  <span class="logo"><span class="logo-show">show</span><span class="logo-flix">Flix</span></span>
  <div class="nav-links">
    <a class="on" data-f="all">Home</a><a data-f="Film">Movies</a><a data-f="Series">Series</a><a class="hm" data-f="list">My List</a>
  </div>
  <span class="sp"></span>
  <input class="search" id="q" placeholder="Search titles" aria-label="Search titles">
</nav>

<header class="hero" id="hero">
  <div class="info" id="hinfo">
    <div class="tag" id="htag"></div>
    <h1 id="ht"></h1>
    <p id="hd"></p>
    <div class="btns">
      <button class="btn p" id="hplay">▶ Play</button>
      <button class="btn s" id="hmore">ⓘ More info</button>
    </div>
  </div>
  <div class="player" id="player" hidden>
    <video id="vid" playsinline preload="metadata"></video>
    <div class="err" id="verr" hidden></div>
    <div class="ctrl">
      <button id="pp" aria-label="Play or pause">▶</button>
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek">
      <span id="tm">0:00</span>
      <button id="mu" aria-label="Mute">🔊</button>
      <button id="fs" aria-label="Full screen">⛶</button>
      <button id="cl" aria-label="Close player">✕</button>
    </div>
  </div>
</header>

<main class="rows" id="rows"></main>

<footer><span>Questions? Visit the Help Centre</span><span>Terms of Use</span><span>Privacy</span><span>Devices</span><span>© 2026 showFlix</span></footer>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Title details">
  <div class="sheet">
    <div class="mh" id="mh"><button class="x" id="x" aria-label="Close">✕</button><h3 id="mt"></h3></div>
    <div class="mb">
      <div class="detail-layout">
        <img class="detail-poster" id="detailPoster" alt="" hidden>
        <div class="detail-copy">
          <div class="btns"><button class="btn p" id="mplay">▶ Play</button><button class="btn s" id="add">+ My List</button></div>
          <div class="meta" id="mm"></div>
          <p id="md"></p>
        </div>
        <aside class="lead-cast" id="leadCast" aria-label="Main cast">
          <h4>Main cast</h4>
          <div class="cast-list" id="castList"><p class="cast-status">Loading cast…</p></div>
        </aside>
      </div>
      <div class="detail-player" id="detailPlayer" hidden>
        <iframe id="detailStream" title="Movie or series player" width="100%" height="100%" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen hidden></iframe>
        <video id="detailVideo" controls playsinline preload="metadata" hidden></video>
        <p class="detail-player-message" id="detailPlayerMessage" hidden></p>
      </div>
    </div>
  </div>
</div>



<script src="script.js?v=tmdb-netlify-env-20261102"></script>
</body>
</html>
